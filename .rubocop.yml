plugins:
  - rubocop-md
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

require:
  - ./.rubocop/cops/ban_to_markdown

Custom/BanToMarkdown:
  Enabled: true
  Include:
    - 'lib/live_set/model/**/*.rb'

AllCops:
  Exclude:
    - binstub/**/*
    - exe/**/*
    - vendor/**/*
    - Gemfile*
    - '**/*.md'
  NewCops: enable
  TargetRubyVersion: 3.4

Naming/FileName:
  Exclude:
    - Rakefile
    - CHANGELOG.md
    - LICENSE.md
    - README.md
    - TODO.md

# The keyword arguments of the list declarations are named after the direction they apply to, and
# the others are named after what they are: the version a conversion comes from and the version it
# goes to, and the id of the thing a fragment describes.
Naming/MethodParameterName:
  AllowedNames:
    - from
    - id
    - to
    - up

Gemspec/DeprecatedAttributeAssignment:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false

Layout/HashAlignment:
  EnforcedColonStyle: table
  EnforcedHashRocketStyle: table

Layout/LineLength:
  Max: 150

Metrics/AbcSize:
  Max: 35

Metrics/BlockLength:
  Exclude:
    - live_set.gemspec
  Max: 30

# A class in this project is expected to grow, and the limit only discourages the comments that
# explain what the class does.
Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Max: 15

Layout/ExtraSpacing:
  Enabled: false

Metrics/MethodLength:
  Max: 80

Metrics/ModuleLength:
  Enabled: false

Metrics/PerceivedComplexity:
  Max: 15

RSpec/DescribeMethod:
  Exclude:
    - spec/live_set/live_set_track_clip_slots_spec.rb

RSpec/ExampleLength:
  Enabled: false

RSpec/ExpectOutput:
  Enabled: false

RSpec/InstanceVariable:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

# The model classes are named for the thing they model, so that the spec files can be
# named to match.
RSpec/SpecFilePathFormat:
  CustomTransform:
    LiveScene: live_scene
    LiveTrack: live_track
    LiveTracks: live_tracks
    Run: common/run
    String: string
  Exclude:
    - spec/live_set/live_set_track_clip_slots_spec.rb
  Enabled: false

Style/CommentedKeyword:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma
