plugins:
  - rubocop-md
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  Exclude:
    - binstub/**/*
    - exe/**/*
    - vendor/**/*
    - Gemfile*
    # TODO.md quotes Ruby excerpts that are not standalone-parseable programs.
    - TODO.md
  NewCops: enable
  TargetRubyVersion: 3.4

Naming/FileName:
  Exclude:
    - Rakefile
    - CHANGELOG.md
    - LICENSE.md
    - README.md
    - TODO.md

Gemspec/DeprecatedAttributeAssignment:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false

Layout/HashAlignment:
  EnforcedColonStyle: table
  EnforcedHashRocketStyle: table

Layout/LineLength:
  Max: 150

Metrics/AbcSize:
  Max: 35

Metrics/BlockLength:
  Exclude:
    - live_set.gemspec
  Max: 30

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/MethodLength:
  Max: 40

Metrics/ModuleLength:
  Enabled: false

Metrics/PerceivedComplexity:
  Max: 15

RSpec/DescribeMethod:
  Exclude:
    - spec/live_set/live_set_track_clip_slots_spec.rb

# The classes in this project are namespaced under the live_set_ prefix, so that
# the spec files can be named to match.
RSpec/SpecFilePathFormat:
  CustomTransform:
    LiveScene: live_set_scene
    LiveTrack: live_set_track
    LiveTracks: live_tracks
    Run: common/run
    String: string
  Exclude:
    - spec/live_set/live_set_track_clip_slots_spec.rb

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma
